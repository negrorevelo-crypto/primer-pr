<VirtualHost *:80>
    # Igual que en Plesk: la raíz web es chelart/public y config/ queda fuera
    DocumentRoot /var/www/chelart/public
    <Directory /var/www/chelart/public>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    # El panel /admin/ exige HTTPS; en local se simula (localhost cuenta como contexto seguro)
    SetEnv HTTPS on
</VirtualHost>
